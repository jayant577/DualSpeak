<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VaaniGen</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <h2 id="gateTitle">Log in</h2>
    <input id="gateUser" type="text" placeholder="Username" autocomplete="username">
    <input id="gatePass" type="password" placeholder="Password" autocomplete="current-password">
    <input id="gateConfirm" type="password" placeholder="Confirm password" style="display:none;">
    <button class="btn primary" id="gateSubmit" type="button">Log in</button>
    <p class="gate-switch"><span id="gateSwitchText">New here?</span> <button class="linklike" id="gateToggle" type="button">Create an account</button></p>
    <p class="hint" id="gateError"></p>
  </div>
</div>
<main class="shell" id="app">
  <div class="account-bar">
    <span id="whoami"></span>
    <button class="linklike" id="logoutBtn" type="button">Log out</button>
  </div>
  <h1>Speak</h1>
  <p class="subtitle">Reads your text aloud in English or Marathi, at the pace you choose.</p>

  <hr class="rule" />

  <span class="label">Your text</span>
  <textarea id="text" lang="en">Hello! This is a sample sentence to test the reader. Replace this with anything you'd like to hear aloud — in English or Marathi.</textarea>

  <hr class="rule" />

  <div class="row">
    <div class="group">
      <span class="label">Language</span>
      <div class="seg" id="langSeg">
        <button data-lang="en" class="active" type="button">English</button>
        <button data-lang="mr" type="button">मराठी</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Speed</span>
      <div class="seg" id="speedSeg">
        <button data-rate="0.5" type="button">Very slow</button>
        <button data-rate="0.75" type="button">Slow</button>
        <button data-rate="1" class="active" type="button">Normal</button>
        <button data-rate="1.5" type="button">Fast</button>
      </div>
    </div>
  </div>

  <div class="group voice-group">
    <span class="label">Voice</span>
    <select id="voice"></select>
    <p class="hint" id="voiceHint"></p>
  </div>

  <div class="playbar">
    <button class="btn primary" id="playBtn" type="button">Play</button>
    <button class="btn secondary" id="stopBtn" type="button" disabled>Stop</button>
    <span class="status" id="status">Ready</span>
  </div>
  <div class="progress"><div class="progress-fill" id="fill"></div></div>

  <hr class="rule" />

  <span class="label">Reading</span>
  <div class="page">
    <p id="reading">Press play to begin — each word will light up here as it's spoken.</p>
  </div>

  <hr class="rule" />

  <span class="label">History on this device</span>
  <div id="historyList"></div>
  <button class="btn secondary" id="clearHistoryBtn" type="button">Clear history</button>
</main>

<script src="script.js"></script>
</body>
</html>
